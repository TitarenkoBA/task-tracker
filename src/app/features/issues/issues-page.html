<app-page-header [title]="'nav.issues' | t">
  <div class="mx-auto max-w-5xl px-4 pb-3 lg:px-8">
    <div class="flex gap-2">
      <label class="relative flex-1">
        <span class="sr-only">{{ 'issues.searchLabel' | t }}</span>
        <app-icon
          name="search"
          [size]="18"
          class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-400"
        />
        <input
          #search
          class="input pl-10"
          type="search"
          [placeholder]="'issues.searchPlaceholder' | t"
          enterkeyhint="search"
          [value]="state.filter().query"
          (input)="set('query', $any($event.target).value)"
        />
      </label>
      <button
        type="button"
        class="btn-secondary relative px-3"
        [attr.aria-expanded]="state.panelOpen()"
        (click)="state.panelOpen.set(!state.panelOpen())"
      >
        <app-icon name="filter" [size]="18" />
        <span class="hidden sm:inline">{{ 'issues.filters' | t }}</span>
        @if (filterCount()) {
          <span
            class="absolute -top-1.5 -right-1.5 flex size-5 items-center justify-center rounded-full bg-brand-600 text-[11px] font-bold text-white"
          >
            {{ filterCount() }}
          </span>
        }
      </button>
    </div>

    @if (state.panelOpen()) {
      <div class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4">
        <select
          class="input"
          [attr.aria-label]="'field.project' | t"
          (change)="set('projectId', $any($event.target).value)"
        >
          <option value="">{{ 'issues.allProjects' | t }}</option>
          @for (p of projects.projects(); track p.id) {
            <option [value]="p.id" [selected]="state.filter().projectId === p.id">
              {{ p.name }}
            </option>
          }
        </select>
        <select
          class="input"
          [attr.aria-label]="'field.statusId' | t"
          (change)="set('category', $any($event.target).value)"
        >
          <option value="">{{ 'issues.anyStatus' | t }}</option>
          @for (c of categoryList; track c) {
            <option [value]="c" [selected]="state.filter().category === c">
              {{ i18n.category(c) }}
            </option>
          }
        </select>
        <select
          class="input"
          [attr.aria-label]="'field.assigneeId' | t"
          (change)="set('assignee', $any($event.target).value)"
        >
          <option value="">{{ 'issues.anyAssignee' | t }}</option>
          <option value="me" [selected]="state.filter().assignee === 'me'">
            {{ 'issues.mine' | t }}
          </option>
          <option value="none" [selected]="state.filter().assignee === 'none'">
            {{ 'issues.unassigned' | t }}
          </option>
          @for (p of people.people(); track p.id) {
            <option [value]="p.id" [selected]="state.filter().assignee === p.id">
              {{ p.name }}
            </option>
          }
        </select>
        <select
          class="input"
          [attr.aria-label]="'field.type' | t"
          (change)="set('type', $any($event.target).value)"
        >
          <option value="">{{ 'issues.anyType' | t }}</option>
          @for (t of typeList; track t) {
            <option [value]="t" [selected]="state.filter().type === t">
              {{ i18n.issueType(t) }}
            </option>
          }
        </select>
        <select
          class="input"
          [attr.aria-label]="'field.priority' | t"
          (change)="set('priority', $any($event.target).value)"
        >
          <option value="">{{ 'issues.anyPriority' | t }}</option>
          @for (p of priorityOrder; track p) {
            <option [value]="p" [selected]="state.filter().priority === p">
              {{ i18n.priority(p) }}
            </option>
          }
        </select>
        <select
          class="input"
          [attr.aria-label]="'field.labels' | t"
          (change)="set('label', $any($event.target).value)"
        >
          <option value="">{{ 'issues.anyLabel' | t }}</option>
          @for (l of allLabels(); track l) {
            <option [value]="l" [selected]="state.filter().label === l">{{ l }}</option>
          }
        </select>
        <select
          class="input"
          [attr.aria-label]="'issues.sort' | t"
          (change)="state.sort.set($any($event.target).value)"
        >
          @for (s of sortList; track s) {
            <option [value]="s" [selected]="state.sort() === s">{{ sortLabel(s) | t }}</option>
          }
        </select>
        <button type="button" class="btn-ghost" [disabled]="!filterCount()" (click)="reset()">
          {{ 'issues.resetFilters' | t }}
        </button>
      </div>
    }
  </div>
</app-page-header>

<div class="mx-auto max-w-5xl px-4 py-3 lg:px-8">
  @if (results().length) {
    <p class="mb-2 px-1 text-xs text-slate-500">
      {{ 'issues.found' | t: { count: results().length } }}
    </p>
    <div class="card divide-y divide-slate-100 overflow-hidden dark:divide-slate-800">
      @for (issue of visible(); track issue.id) {
        <app-issue-row [issue]="issue" />
      }
    </div>
    @if (results().length > visible().length) {
      <button
        type="button"
        class="btn-secondary mx-auto mt-4 flex"
        (click)="limit.set(limit() + 100)"
      >
        {{ 'issues.showMore' | t: { count: results().length - visible().length } }}
      </button>
    }
  } @else {
    <app-empty-state icon="search" [title]="'issues.nothing' | t" [text]="'issues.nothingText' | t">
      @if (filterCount() || state.filter().query) {
        <button type="button" class="btn-secondary" (click)="reset()">
          {{ 'common.reset' | t }}
        </button>
      }
      <button type="button" class="btn-primary" (click)="actions.createIssue()">
        <app-icon name="plus" [size]="18" /> {{ 'common.createIssue' | t }}
      </button>
    </app-empty-state>
  }
</div>
